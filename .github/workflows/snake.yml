# The contribution snake under the profile README, in the brand's colours: redrawn every day.
name: Serpent des contributions

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#B47506&color_dots=#ECE8DF,#E8DCC0,#D6BE85,#C49A45,#B47506
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F5B83D&color_background=#0B1020&color_dots=#19223F,#263156,#3A4672,#56628F,#F5B83D
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
